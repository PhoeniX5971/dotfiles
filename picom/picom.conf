# Backend
backend = "glx";
vsync = false;
use-damage = true;

# General settings
corner-radius = 10;
round-borders = 1;
refresh-rate = 60;

# Shadows
shadow = true;
shadow-radius = 15;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.8;
shadow-exclude = [
  "class_g = 'Conky'",
  "class_g ?= 'cairo-clock'",
];

# Opacity
inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;

opacity-rule = [
  "100:class_g = 'Zen-browser'",
  "100:class_g = 'zen-browser'",
  "100:class_g = 'Rofi'",
  "100:class_g = 'awesome'",
  "100:fullscreen",
  "100:_NET_WM_STATE@:32a = '_NET_WM_STATE_FULLSCREEN'"
];

# Fading
fading = false;
fade-delta = 10;
fade-in-step = 0.05;
fade-out-step = 0.05;
wintype-fading = true;

# Blur (optional, needs compositor support)
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

blur-kern = "7x7box";

# Animations (FTLabs specific)
animations = true;
animation-stiffness = 125.0;
animation-dampening = 10.0;
animation-window-mass = 0.5;
animation-clamping = false;

animation-for-open-window = "squeeze-bottom";
animation-for-unmap-window = "squeeze-bottom";
animation-for-transient-window = "squeeze-bottom";


# Experimental
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;

# Exclude windows from blur
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
];

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
];

wintypes:
{
  normal = { fade = true; shadow = true; };
  tooltip = { fade = true; shadow = true; opacity = 1.0; };
  dock = { shadow = true; };
  dnd = { shadow = true; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
