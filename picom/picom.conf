backend = "glx";

# Enable fading on windows
fading = true;
fade-delta = 8;

# Enable animations when windows appear
wintype-fading = true;

# Animation for fading windows (0.1 to 1)
frame-opacity = 0.95;

# Set animation time for fade-in and fade-out
fade-in-step = 0.075;
fade-out-step = 0.075;

# Enable shadow for windows
shadow = true;
shadow-radius = 15;
shadow-opacity = 0.8;

# General opacity settings
active-opacity = 1;
inactive-opacity = 0.9;

# Exclude certain windows from opacity (Brave, AwesomeWM bar, popups)
opacity-rule = [
    "100:class_g = 'Brave-browser'",  # Exclude Brave from opacity
    "100:class_g = 'Awesome'",        # Exclude AwesomeWM bar
    "100:class_g = 'Rofi'",           # Exclude Rofi popups
    "100:class_g = 'Pinentry-gtk-2'", # Exclude password popups
    "100:class_g = 'Notification'",   # Exclude notifications
    "100:_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# Ensure popups and menus are fully visible
wintypes:
{
    tooltip = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
    popup_menu = { opacity = 1.0; };
    utility = { opacity = 1.0; };
    dock = { opacity = 1.0; };
};
